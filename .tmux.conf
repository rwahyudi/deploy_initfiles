# bind-key -r  S-Left resize-pane -L 5
# bind-key -r S-Right resize-pane -R 5
# bind-key -r    C-Up resize-pane -U
# bind-key -r  C-Down resize-pane -D



##### STATUS BAR #####
set -g status-left "#[fg=white] #h #[fg=green] | %H:%M:%S | #[fg=yellow]%Y%m%d |#[default]"
set -g status-left-length 50
set -g status-right "[%a %Y-%m-%d %H:%M#[default]]"
set -g status-right-length 50

#set -g default-terminal "screen"
#set -g default-terminal "xterm"
#set -g default-terminal "screen-256color"



## COLOURS
##### COLOUR (Solarized 256)

set-window-option -g window-style 'bg=#101010'
set-window-option -g window-active-style 'bg=#151515'

set -g pane-border-style fg=colour238,bg=#101010
set -g pane-active-border-style fg=colour113,bg=#151515

# statusbar colors
set -g status-bg colour232
set -g status-fg colour250
set-window-option -g window-status-current-style fg=black,bg=green

# pane number display
set-option -g display-panes-active-colour colour33 #blue
set-option -g display-panes-colour colour166 #orange

# clock
set-window-option -g clock-mode-colour colour64 #green
